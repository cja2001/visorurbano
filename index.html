<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Visor Territorial | San Salvador Sur</title>

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- Leaflet Draw -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />

    <!-- Marker Cluster -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">

    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">

    <!-- CSS del proyecto -->

    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/sidebar.css">
    <link rel="stylesheet" href="assets/css/popup.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
    <link rel="stylesheet" href="assets/css/dark.css">

</head>

<body>

    <!-- ===================================================== -->
    <!-- BARRA SUPERIOR -->
    <!-- ===================================================== -->

    <header id="topbar">

        <div class="logo">

            <img src="assets/images/logo.png" alt="Logo">

            <div>

                <h2>Visor Territorial</h2>

                <span>San Salvador Sur</span>

            </div>

        </div>

        <div class="search-container">

            <input type="text" id="globalSearch" placeholder="Buscar calle, proyecto, cantón, centro de votación...">

            <button id="btnSearch">

                <i class="fa-solid fa-magnifying-glass"></i>

            </button>

        </div>

        <div class="toolbar">

            <button title="Inicio">

                <i class="fa-solid fa-house"></i>

            </button>

            <button title="Pantalla completa">

                <i class="fa-solid fa-expand"></i>

            </button>

            <button title="Ubicación">

                <i class="fa-solid fa-location-crosshairs"></i>

            </button>

            <button title="Imprimir">

                <i class="fa-solid fa-print"></i>

            </button>

        </div>

    </header>

    <!-- ===================================================== -->
    <!-- CONTENEDOR -->
    <!-- ===================================================== -->

    <div id="container">

        <!-- ===================================== -->
        <!-- SIDEBAR -->
        <!-- ===================================== -->

        <aside id="sidebar">
            <div class="sidebar-tabs">
                <button class="tab-btn active" data-tab="layers" title="Capas">
                    <i class="fa-solid fa-layer-group"></i>
                    <span>Capas</span>
                </button>
                <button class="tab-btn" data-tab="stats" title="Estadísticas">
                    <i class="fa-solid fa-chart-column"></i>
                    <span>Estadísticas</span>
                </button>
                <button class="tab-btn" data-tab="legend" title="Leyenda">
                    <i class="fa-solid fa-map"></i>
                    <span>Leyenda</span>
                </button>
            </div>

            <div class="tab-content active" id="tab-layers">
                <div id="layerList">
                    <!-- Se llenará automáticamente -->
                </div>
            </div>

            <div class="tab-content" id="tab-stats">
                <div class="sidebar-section">
                    <h3>
                        <i class="fa-solid fa-chart-column"></i>
                        Estadísticas
                    </h3>

                    <!-- Constructor de gráfico -->
                    <div id="chartBuilder" style="display:flex;flex-direction:column;gap:10px;">
                        <label
                            style="font-size:12px;font-weight:600;color:var(--text-light);text-transform:uppercase;letter-spacing:.5px;">Capa</label>
                        <select id="chartLayerSelect"
                            style="width:100%;padding:7px 10px;border-radius:8px;border:1px solid var(--border);background:var(--panel-bg);color:var(--text);font-size:13px;">
                            <option value="">-- Seleccionar capa --</option>
                        </select>

                        <label
                            style="font-size:12px;font-weight:600;color:var(--text-light);text-transform:uppercase;letter-spacing:.5px;">Campo
                            a analizar</label>
                        <select id="chartFieldSelect"
                            style="width:100%;padding:7px 10px;border-radius:8px;border:1px solid var(--border);background:var(--panel-bg);color:var(--text);font-size:13px;">
                            <option value="">-- Primero elige una capa --</option>
                        </select>

                        <label
                            style="font-size:12px;font-weight:600;color:var(--text-light);text-transform:uppercase;letter-spacing:.5px;">Tipo
                            de gráfico</label>
                        <select id="chartTypeSelect"
                            style="width:100%;padding:7px 10px;border-radius:8px;border:1px solid var(--border);background:var(--panel-bg);color:var(--text);font-size:13px;">
                            <option value="bar">&#9646; Barras</option>
                            <option value="pie">&#11044; Torta</option>
                            <option value="doughnut">&#9711; Dona</option>
                        </select>

                        <button id="btnGenerateChart" style="
                            width:100%;padding:9px;border-radius:8px;border:none;
                            background:var(--primary,#0B5ED7);color:#fff;
                            font-size:13px;font-weight:600;cursor:pointer;
                            display:flex;align-items:center;justify-content:center;gap:8px;
                            transition:opacity .2s;">
                            <i class="fa-solid fa-chart-bar"></i> Generar gráfico
                        </button>
                    </div>
                </div>
            </div>


            <div class="tab-content" id="tab-legend">
                <div class="sidebar-section">
                    <h3>
                        <i class="fa-solid fa-map"></i>
                        Leyenda
                    </h3>
                    <div id="legend">
                    </div>
                </div>
            </div>
        </aside>

        <!-- ===================================== -->
        <!-- MAPA -->
        <!-- ===================================== -->

        <main id="mapContainer">
            <button id="toggleSidebar" class="panel-toggle-btn left" title="Ocultar/Mostrar Capas">
                <i class="fa-solid fa-chevron-left"></i>
            </button>
            <button id="toggleInfoPanel" class="panel-toggle-btn right" title="Ocultar/Mostrar Info">
                <i class="fa-solid fa-chevron-right"></i>
            </button>
            <div id="map"></div>
        </main>

        <!-- ===================================== -->
        <!-- PANEL DERECHO -->
        <!-- ===================================== -->

        <aside id="infoPanel">

            <div class="panel-title">
                <i class="fa-solid fa-chart-bar"></i>
                Gráficos
            </div>

            <!-- Panel de gráfico -->
            <div id="chartPanel" style="padding:16px;">
                <!-- Placeholder cuando no hay gráfico -->
                <div id="chartPlaceholder"
                    style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:40px 16px;text-align:center;opacity:.5;">
                    <i class="fa-solid fa-chart-column" style="font-size:40px;color:var(--text-light);"></i>
                    <p style="font-size:13px;color:var(--text-light);margin:0;">Selecciona una capa y un campo en la
                        pestaña <strong>Estadísticas</strong> para generar un gráfico.</p>
                </div>

                <!-- Contenido del gráfico (oculto hasta generarlo) -->
                <div id="chartContent" style="display:none;">
                    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
                        <span id="chartPanelTitle" style="font-size:13px;font-weight:700;color:var(--text);"></span>
                        <button id="btnCloseChart" title="Limpiar gráfico"
                            style="background:none;border:none;cursor:pointer;color:var(--text-light);font-size:16px;">&#10005;</button>
                    </div>
                    <div style="position:relative;width:100%;">
                        <canvas id="mainChart"></canvas>
                    </div>
                    <div id="chartSummary"
                        style="margin-top:12px;font-size:11px;color:var(--text-light);text-align:center;"></div>
                </div>
            </div>

        </aside>

    </div>

    <!-- ===================================================== -->
    <!-- FOOTER -->
    <!-- ===================================================== -->

    <footer>

        <div>

            Visor Urbano © 2026

        </div>

        <div>

            Leaflet | OpenStreetMap | Municipalidad

        </div>

    </footer>

    <!-- ===================================================== -->
    <!-- LIBRERÍAS -->
    <!-- ===================================================== -->

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/Turf.js/6.5.0/turf.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>

    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>

    <!-- ===================================================== -->
    <!-- JS DEL PROYECTO -->
    <!-- ===================================================== -->

    <script type="module" src="assets/js/app.js"></script>

</body>

</html>
