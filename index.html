<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Visor Urbano | San Salvador Sur</title>

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- Leaflet Draw -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />

    <!-- Marker Cluster -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">

    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">

    <!-- CSS del proyecto -->

    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/sidebar.css">
    <link rel="stylesheet" href="assets/css/popup.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
    <link rel="stylesheet" href="assets/css/dark.css">

</head>

<body>

    <!-- ===================================================== -->
    <!-- BARRA SUPERIOR -->
    <!-- ===================================================== -->

    <header id="topbar">

        <div class="logo">

            <img src="assets/images/logo.png" alt="Logo">

            <div>

                <h2>Visor Territorial</h2>

                <span>San Salvador Sur</span>

            </div>

        </div>

        <div class="search-container">

            <input type="text" id="globalSearch" placeholder="Buscar calle, proyecto, cantón, centro de votación...">

            <button id="btnSearch">

                <i class="fa-solid fa-magnifying-glass"></i>

            </button>

        </div>

        <div class="toolbar">

            <button title="Inicio">

                <i class="fa-solid fa-house"></i>

            </button>

            <button title="Pantalla completa">

                <i class="fa-solid fa-expand"></i>

            </button>

            <button title="Ubicación">

                <i class="fa-solid fa-location-crosshairs"></i>

            </button>

            <button title="Imprimir">

                <i class="fa-solid fa-print"></i>

            </button>

        </div>

    </header>

    <!-- ===================================================== -->
    <!-- CONTENEDOR -->
    <!-- ===================================================== -->

    <div id="container">

        <!-- ===================================== -->
        <!-- SIDEBAR -->
        <!-- ===================================== -->

        <aside id="sidebar">
            <div class="sidebar-tabs">
                <button class="tab-btn active" data-tab="layers" title="Capas">
                    <i class="fa-solid fa-layer-group"></i>
                    <span>Capas</span>
                </button>
                <button class="tab-btn" data-tab="stats" title="Estadísticas">
                    <i class="fa-solid fa-chart-column"></i>
                    <span>Estadísticas</span>
                </button>
                <button class="tab-btn" data-tab="legend" title="Leyenda">
                    <i class="fa-solid fa-map"></i>
                    <span>Leyenda</span>
                </button>
            </div>

            <div class="tab-content active" id="tab-layers">
                <div id="layerList">
                    <!-- Se llenará automáticamente -->
                </div>
            </div>

            <div class="tab-content" id="tab-stats">
                <div class="sidebar-section">
                    <h3>
                        <i class="fa-solid fa-chart-column"></i>
                        Estadísticas
                    </h3>
                    <div id="statsPanel">
                        <div class="stat-card">
                            <h2 id="totalLayers">0</h2>
                            <span>Capas</span>
                        </div>
                        <div class="stat-card">
                            <h2 id="totalFeatures">0</h2>
                            <span>Elementos</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="tab-content" id="tab-legend">
                <div class="sidebar-section">
                    <h3>
                        <i class="fa-solid fa-map"></i>
                        Leyenda
                    </h3>
                    <div id="legend">
                    </div>
                </div>
            </div>
        </aside>

        <!-- ===================================== -->
        <!-- MAPA -->
        <!-- ===================================== -->

        <main id="mapContainer">
            <button id="toggleSidebar" class="panel-toggle-btn left" title="Ocultar/Mostrar Capas">
                <i class="fa-solid fa-chevron-left"></i>
            </button>
            <button id="toggleInfoPanel" class="panel-toggle-btn right" title="Ocultar/Mostrar Info">
                <i class="fa-solid fa-chevron-right"></i>
            </button>
            <div id="map"></div>
        </main>

        <!-- ===================================== -->
        <!-- PANEL DERECHO -->
        <!-- ===================================== -->

        <aside id="infoPanel">

            <div class="panel-title">

                <i class="fa-solid fa-circle-info"></i>

                Información

            </div>

            <div id="featureInfo">

                <p>

                    Seleccione un elemento del mapa.

                </p>

            </div>

        </aside>

    </div>

    <!-- ===================================================== -->
    <!-- FOOTER -->
    <!-- ===================================================== -->

    <footer>

        <div>

            Visor Urbano © 2026

        </div>

        <div>

            Leaflet | OpenStreetMap | Municipalidad

        </div>

    </footer>

    <!-- ===================================================== -->
    <!-- LIBRERÍAS -->
    <!-- ===================================================== -->

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/Turf.js/6.5.0/turf.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>

    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

    <!-- ===================================================== -->
    <!-- JS DEL PROYECTO -->
    <!-- ===================================================== -->

    <script type="module" src="assets/js/app.js"></script>

</body>

</html>
